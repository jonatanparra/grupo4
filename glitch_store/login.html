<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="img/favicon.png" type="image/png">
<title>Iniciar sesión — Glitch Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="encabezado">
  <nav class="nav">
    <a href="index.html" class="marca"><img src="img/logo.png" alt="Glitch Store" class="marca__logo"></a>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="productos.html">Productos</a></li>
      <li><a href="nosotros.html">Nosotros</a></li>
      <li><a href="blogs.html">Blogs</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
    <div class="nav-acciones">
      <a href="carrito.html" class="carrito-boton">🛒 <span data-carrito-contador>0</span></a>
    </div>
  </nav>
</header>

<main class="seccion centrado">
  <div class="contenedor" style="display:flex; flex-direction:column; align-items:center;">
    <div style="text-align:center; margin-bottom: 20px;">
      <img src="img/logo.png" alt="Glitch Store" style="height:44px; margin:0 auto 8px; display:block;">
    </div>
    <form class="formulario" id="form-login" novalidate>
      <p class="formulario__titulo">Inicio de sesión</p>

      <div class="mensaje-exito" id="mensaje-exito">Sesión iniciada correctamente. ¡Bienvenido/a de vuelta!</div>

      <div class="campo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" maxlength="100" placeholder="nombre@duoc.cl">
        <span class="mensaje-error" id="correo-error"></span>
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" maxlength="10">
        <span class="ayuda-campo">Entre 4 y 10 caracteres.</span>
        <span class="mensaje-error" id="contrasena-error"></span>
      </div>

      <button type="submit" class="boton boton--ocre boton--ancho">Iniciar sesión</button>
      <p style="text-align:center; margin-top:16px; font-size:0.9rem;">
        ¿No tienes cuenta? <a href="registro.html" style="color:var(--verde-musgo); font-weight:600;">Regístrate</a>
      </p>
    </form>
  </div>
</main>

<footer class="pie">
  <div class="contenedor">
    <div class="pie__inferior">
      <span>© <span data-anio></span> Glitch Store. Proyecto académico DSY1104.</span>
      <a href="contacto.html">Contacto</a>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/validaciones.js"></script>
<script src="js/carrito.js"></script>
<script src="js/main.js"></script>
<script>
  const reglas = {
    correo: () => validarCorreo(document.getElementById("correo").value, true) || validarMaximo(document.getElementById("correo").value, 100, "El correo"),
    contrasena: () => validarContrasena(document.getElementById("contrasena").value),
  };

  Object.keys(reglas).forEach((id) => validarEnVivo(id, reglas[id]));

  document.getElementById("form-login").addEventListener("submit", (e) => {
    e.preventDefault();
    const mensajeExito = document.getElementById("mensaje-exito");
    if (validarFormulario(reglas)) {
      mensajeExito.classList.add("mensaje-exito--visible");
    } else {
      mensajeExito.classList.remove("mensaje-exito--visible");
    }
  });
</script>
</body>
</html>
