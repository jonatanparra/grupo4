<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../img/favicon.png" type="image/png">
<title>Usuarios — Panel administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__marca"><img src="../img/logo.png" alt="Glitch Store" class="marca__logo"><span class="admin-sidebar__marca-tag">admin</span></div>
    <nav>
      <a href="home.html">📊 Dashboard</a>
      <a href="productos.html">🎮 Productos</a>
      <a href="usuarios.html">👤 Usuarios</a>
    </nav>
    <div class="admin-sidebar__pie">
      <a href="../index.html">← Volver a la tienda</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-encabezado">
      <h1>Usuarios</h1>
      <a href="nuevo-usuario.html" class="boton boton--ocre">+ Nuevo usuario</a>
    </div>

    <div class="admin-panel">
      <table class="tabla-admin">
        <thead>
          <tr><th>RUN</th><th>Nombre</th><th>Correo</th><th>Tipo</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tabla-usuarios"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../js/data.js"></script>
<script src="../js/carrito.js"></script>
<script src="js/admin.js"></script>
<script>
  document.getElementById("tabla-usuarios").innerHTML = USUARIOS.map(filaUsuarioHTML).join("");

  document.querySelectorAll("[data-eliminar-usuario]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      const fila = e.target.closest("tr");
      if (confirm("¿Eliminar este usuario del listado? (simulado, no persiste)")) {
        fila.remove();
      }
    });
  });
</script>
</body>
</html>
