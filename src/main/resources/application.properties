# =========================================================
# Glitch Store API - configuración general
# Los datos sensibles (contraseña de la BD, ruta del Wallet, secreto JWT)
# NO van aquí: se leen de variables de entorno o del archivo
# application-local.properties (no versionado). Ver README.
# =========================================================
spring.application.name=glitch-store-backend
server.port=8080

spring.config.import=optional:file:./application-local.properties

# ---------- Oracle Cloud (Autonomous Database) con Wallet ----------
# TNS_ADMIN apunta a la carpeta del Wallet descomprimido (tnsnames.ora, cwallet.sso...).
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICE:database2026_high}?TNS_ADMIN=${DB_WALLET}
spring.datasource.username=${DB_USER:GLITCH_STORE}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000

# ---------- JPA / Hibernate ----------
# Las tablas se crean con database/schema.sql (ver InicializadorDatos).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ---------- Seguridad JWT ----------
# Secreto en Base64 (mínimo 256 bits). En producción se define con la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutos=15
app.jwt.refresh-dias=7

# Orígenes permitidos para el frontend (CORS)
app.cors.origenes=http://localhost:5173,http://127.0.0.1:5173

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
